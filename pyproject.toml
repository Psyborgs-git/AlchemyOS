[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alchemyos"
version = "0.1.0"
description = "Local AI Chemistry Factory"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.0",
    "pydantic-settings==2.3.0",
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "pgvector==0.3.2",
    "redis==5.0.4",
    "celery[redis]==5.4.0",
    "langchain==0.2.5",
    "langgraph==0.1.19",
    "openai==1.35.0",
    "rdkit==2024.3.3",
    "ase==3.23.0",
    "sentence-transformers==3.0.1",
    "watchdog==4.0.0",
    "click==8.1.7",
    "httpx==0.27.0",
    "apscheduler==3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "ruff==0.5.0",
    "mypy==1.10.1",
]

[tool.setuptools]
packages = ["backend"]
